<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dyysko</title>

<style>
html,body{margin:0;padding:0;font-family:Arial}
#v{width:75vw;height:55vh;background:#000;display:block;margin:8vh auto 15px}
audio{display:block;width:75vw;max-width:900px;margin:auto}
#info{margin:50px 10px;font-size:12px;line-height:1.7}
</style>
</head>

<body>

<audio id="a" controls crossorigin="anonymous"
src="https://raw.githubusercontent.com/dyzv/m/refs/heads/main/m.mp3"></audio>

<canvas id="v"></canvas>

<div id="info">
Time: <span id="clock"></span><br>
Modified: <span id="modified"></span><br>
Screen: <span id="screen"></span><br>
Browser: <span id="browser"></span><br>
OS: <span id="os"></span><br>
Language: <span id="lang"></span><br>
Online: <span id="online"></span><br>
URL: <span id="url"></span><br>
Repo: dyzv / m<br>
IP: <span id="ip">...</span>
</div>

<script>

let c=v,x=c.getContext("2d"),p=[],N;

a.onplay=()=>{

if(N)return;

let C=new AudioContext(),
n=C.createAnalyser();

n.fftSize=128;

C.createMediaElementSource(a).connect(n);
n.connect(C.destination);

let d=new Uint8Array(n.frequencyBinCount);

p=d.map(()=>0);
N=1;

function draw(){

requestAnimationFrame(draw);
n.getByteFrequencyData(d);

c.width=c.clientWidth;
c.height=c.clientHeight;

x.clearRect(0,0,c.width,c.height);

d.forEach((z,i)=>{

let h=z/255*c.height;

p[i]=Math.max(p[i]-.8,h);

x.fillStyle="#fff";

x.fillRect(
i*c.width/d.length,
c.height-h,
c.width/d.length-2,
h
);

x.fillRect(
i*c.width/d.length,
c.height-p[i]-3,
c.width/d.length-2,
3
);

});

}

draw();

};

clock.innerHTML=new Date();
setInterval(()=>clock.innerHTML=new Date(),1000);

modified.innerHTML=document.lastModified;
screen.innerHTML=screen.width+" x "+screen.height;
browser.innerHTML=navigator.userAgent;
os.innerHTML=navigator.platform;
lang.innerHTML=navigator.language;
online.innerHTML=navigator.onLine?"Online":"Offline";
url.innerHTML=location.href;

fetch("https://api.ipify.org?format=json")
.then(r=>r.json())
.then(r=>ip.innerHTML=r.ip);

</script>

</body>
</html>
