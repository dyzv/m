<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dyysko</title>

<style>
html,body{margin:0;padding:10px;font-family:Arial}
.box{border:1px solid #ccc;padding:10px;margin:10px 0}
#v{width:100%;height:120px;background:#000}
audio{width:100%}
</style>
</head>

<body>

<h1>GitHub Pages Test Dashboard</h1>

<div class="box"><b>Current Time:</b><div id="clock"></div></div>
<div class="box"><b>Page Last Modified:</b><div id="modified"></div></div>
<div class="box"><b>Screen Resolution:</b><div id="screen"></div></div>
<div class="box"><b>Browser:</b><div id="browser"></div></div>
<div class="box"><b>Operating System:</b><div id="os"></div></div>
<div class="box"><b>Language:</b><div id="lang"></div></div>
<div class="box"><b>Online Status:</b><div id="online"></div></div>
<div class="box"><b>Current URL:</b><div id="url"></div></div>
<div class="box"><b>GitHub Repository:</b><div>dyzv / m</div></div>
<div class="box"><b>Public IP Address:</b><div id="ip">Loading...</div></div>

<div class="box">
<b>Audio:</b><br><br>
<audio id="a" controls crossorigin="anonymous"
src="https://raw.githubusercontent.com/dyzv/m/refs/heads/main/m.mp3"></audio>
<br><br>
<canvas id="v"></canvas>
</div>

<script>

/* dashboard */

clock.innerHTML=new Date();
setInterval(()=>clock.innerHTML=new Date(),1000);

modified.innerHTML=document.lastModified;
screen.innerHTML=screen.width+" x "+screen.height;
browser.innerHTML=navigator.userAgent;
os.innerHTML=navigator.platform;
lang.innerHTML=navigator.language;
online.innerHTML=navigator.onLine?"Online":"Offline";
url.innerHTML=location.href;

fetch("https://api.ipify.org?format=json")
.then(x=>x.json())
.then(x=>ip.innerHTML=x.ip)
.catch(()=>ip.innerHTML="Unable to fetch");


/* audio visualizer */

let c=v,x=c.getContext("2d"),A;

a.onplay=()=>{

 if(A)return;

 let C=new AudioContext(),
     N=C.createAnalyser(),
     S=C.createMediaElementSource(a);

 N.fftSize=128;
 S.connect(N);
 N.connect(C.destination);
 A=new Uint8Array(N.frequencyBinCount);

 function draw(){

  requestAnimationFrame(draw);
  N.getByteFrequencyData(A);

  c.width=c.clientWidth;
  c.height=c.clientHeight;

  x.clearRect(0,0,c.width,c.height);

  A.forEach((n,i)=>{
   let h=n/255*c.height;
   x.fillStyle="#fff";
   x.fillRect(
    i*c.width/A.length,
    c.height-h,
    c.width/A.length-1,
    h
   );
  });

 }

 draw();

};

</script>

</body>
</html>
